plugins { id 'com.android.application' }

android {
    namespace 'online.internet25.comercio'
    compileSdk 34
    defaultConfig {
        applicationId 'online.internet25.comercio'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('I25_VERSION_CODE') ?: '1')
        versionName System.getenv('I25_VERSION_NAME') ?: '1.0'
    }
    signingConfigs {
        release {
            def ks = System.getenv('I25_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('I25_KS_PASS')
                keyAlias System.getenv('I25_KEY_ALIAS') ?: 'internet25'
                keyPassword System.getenv('I25_KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('I25_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
